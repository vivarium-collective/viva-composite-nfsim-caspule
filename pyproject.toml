[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "viva-composite-nfsim-caspule"
version = "0.1.0"
description = "Process-bigraph composite: CASPULE bond-aware MD coupled to NFSim rule-based kinetics via an observable detector."
requires-python = ">=3.10"
dependencies = [
  "process-bigraph",
  "bigraph-schema",
  "bigraph-viz",
  "pyyaml",
  "viva-caspule",
  "viva-nfsim",
]

[project.optional-dependencies]
test = ["pytest"]
demo = ["matplotlib", "plotly"]

[project.scripts]
viva-composite-nfsim-caspule = "pbg_composite_nfsim_caspule.run:main"

[tool.setuptools.packages.find]
include = ["pbg_composite_nfsim_caspule*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
